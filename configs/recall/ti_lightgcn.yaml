# TI-LightGCN 召回主实验（S-recall-main）
# 时间感知反馈加权图协同过滤
# embedding 64 / batch 2048 / 200 epoch / 早停耐心 20 / seed 0-4

embedding_size: 64
n_layers: 3
train_batch_size: 2048
eval_batch_size: 4096
epochs: 200
stopping_step: 20
eval_step: 1

learner: adam
learning_rate: 0.001
weight_decay: 0.0001
reg_weight: 1.0e-4

topk: [10, 20]
metrics: ["Recall", "NDCG"]
valid_metric: "Recall@10"
seeds: [0, 1, 2, 3, 4]

# TI-LightGCN 专有参数
lambda_: 0.001          # 时间衰减率（论文式 3-1）
gamma: 0.0              # 长尾正则强度（MVP 先设 0，消融时再启用）
theta: 10               # 长尾阈值（交互次数 < 10 的商品为长尾）
