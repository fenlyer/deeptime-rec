# environment/recbole.yml — RecBole 实验环境（S1-b）
#
# 用途：运行 RecBole 基线模型（LightGCN、SimGCL、BPR、NeuMF 等）。
#       依赖冻结切分，由 scripts/export_recbole.py 导出。
#
# 创建：
#   conda env create -f environment/recbole.yml
# 使用：
#   conda activate recbole_env
#   python experiments/run_recbole.py --model LightGCN --config configs/recbole_baselines.yaml
#
# 版本选择依据：
#   - Python 3.10：RecBole 官方推荐，与 AutoDL 镜像一致
#   - PyTorch 2.5.1+cu121：AutoDL RTX 2080 Ti / CUDA 13.2 兼容
#   - RecBole 1.2.1：AutoDL recbole_env 实际安装版本（2026-11-19 核对）
#   - torch_geometric 2.8.1：RecBole-GNN 依赖
#   - RecBole-GNN：源码安装自 https://github.com/RUCAIBox/RecBole-GNN.git
#
# 改动此文件须同步 docs/decisions.md。

name: recbole_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyyaml
  - matplotlib
  - tqdm
  - colorlog
  - pip
  - pip:
      - torch==2.5.1+cu121
      - --index-url https://download.pytorch.org/whl/cu121
      - torchvision==0.20.1+cu121
      - recbole==1.2.1
      - torch-geometric==2.8.1
      # RecBole-GNN 无 PyPI 包，源码安装（AutoDL rec 环境 S-recall-base 前必装）：
      #   git clone https://github.com/RUCAIBox/RecBole-GNN.git
      #   cp -r RecBole-GNN/recbole_gnn $(python -c 'import site;print(site.getsitepackages()[0])')/
      # 验证：python -c "import recbole_gnn, recbole; from recbole.utils import get_model; get_model('SimGCL')"
